    // --- Main App Component ---
    function App() {
      const [currentThemeKey, setCurrentThemeKey] = useState('modernDark');
      const [slidesData, setSlidesData] = useState(TEMPLATES.startupPitch);
      const [jsonString, setJsonString] = useState(JSON.stringify(TEMPLATES.startupPitch, null, 2));
      const [jsonError, setJsonError] = useState(null);
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
      const [activeTab, setActiveTab] = useState('preview'); // 'preview', 'editor', 'templates'
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [copied, setCopied] = useState(false);

      const theme = THEMES[currentThemeKey] || THEMES.modernDark;
      const currentSlide = slidesData.slides[currentSlideIndex] || slidesData.slides[0];

      // Handle JSON input changes
      const handleJsonChange = (e) => {
        const val = e.target.value;
        setJsonString(val);
        try {
          const parsed = JSON.parse(val);
          if (parsed && Array.isArray(parsed.slides) && parsed.slides.length > 0) {
            setSlidesData(parsed);
            setJsonError(null);
            if (currentSlideIndex >= parsed.slides.length) {
              setCurrentSlideIndex(0);
            }
          } else {
            setJsonError("يجب أن يحتوي ملف الـ JSON على مصفوفة 'slides' تحتوي على شريحة واحدة على الأقل.");
          }
        } catch (err) {
          setJsonError(`خطأ في صياغة JSON: ${err.message}`);
        }
      };

      // Load Template
      const loadTemplate = (key) => {
        if (TEMPLATES[key]) {
          setSlidesData(TEMPLATES[key]);
          setJsonString(JSON.stringify(TEMPLATES[key], null, 2));
          setCurrentSlideIndex(0);
          setJsonError(null);
        }
      };

      // Slide Navigation
      const nextSlide = () => {
        if (currentSlideIndex < slidesData.slides.length - 1) {
          setCurrentSlideIndex(prev => prev + 1);
        }
      };

      const prevSlide = () => {
        if (currentSlideIndex > 0) {
          setCurrentSlideIndex(prev => prev - 1);
        }
      };

      // Keyboard Controls (Arrow keys & Escape for fullscreen)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
          if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
            e.preventDefault();
            // In RTL, ArrowRight usually goes backward or forward based on preference; let's bind:
            nextSlide();
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            prevSlide();
          } else if (e.key === 'Escape' && isFullscreen) {
            setIsFullscreen(false);
          } else if (e.key === 'f' || e.key === 'F') {
            setIsFullscreen(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentSlideIndex, slidesData.slides.length, isFullscreen]);

      // Copy JSON
      const copyJson = () => {
        navigator.clipboard.writeText(jsonString);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      // Export as single self-contained HTML slide deck
      const exportStandaloneHtml = () => {
        const htmlContent = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>${slidesData.title || 'عرض تقديمي'}</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen p-4">
  <div class="text-center">
    <h1 class="text-3xl font-bold mb-4">${slidesData.title || 'عرضك جاهز'}</h1>
    <p class="text-slate-400">تم التصدير بنجاح عبر SlideCraft Studio.</p>
  </div>
</body>
</html>`;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${(slidesData.title || 'presentation').replace(/\s+/g, '_')}.html`;
        link.click();

                <button

                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-200 transition"
                  title="تبديل قالب تجريبي"

                  <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-400" />

                {/* Copy JSON */}
                <button

          {/* Main Layout: Split between Workspace & Preview */}
          <div className={`flex-1 flex flex-col ${isFullscreen ? '' : 'lg:flex-row gap-6'}`}>
            
            {/* Left Panel: JSON Editor & Controls (Hidden in Fullscreen) */}
            {!isFullscreen && (
              <div className="w-full lg:w-[420px] flex flex-col gap-3 bg-slate-900/60 border border-slate-800 rounded-2xl p-4 backdrop-blur-sm mb-4 lg:mb-0">
                <div className="flex items-center justify-between border-b border-slate-800/80 pb-3">
                  <div className="flex items-center gap-2">
                    <Icon name="code" className="w-4 h-4 text-indigo-400" />

                  </div>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">
                    {slidesData.slides.length} شرائح
                  </span>

                {/* Error Banner */}
                {jsonError && (
                  <div className="p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-start gap-2">

                {/* 16:9 Canvas */}
                <div className="w-full slide-aspect relative rounded-2xl overflow-hidden shadow-2xl transition-all duration-300 border border-slate-800/60">

                  {isFullscreen && (
                    <button
                      onClick={() => setIsFullscreen(false)}

                  <div className="flex items-center gap-1.5">

                {/* Slide Thumbnail Preview Strip */}
                {!isFullscreen && (
                  <div className="w-full mt-4 overflow-x-auto no-scrollbar flex items-center gap-3 py-2">
                    {slidesData.slides.map((slide, idx) => (
                      <div
                        key={idx}

                        className={`shrink-0 w-32 slide-aspect rounded-lg p-2 cursor-pointer transition-all duration-200 border text-[9px] flex flex-col justify-between overflow-hidden ${
                          idx === currentSlideIndex 
                            ? 'border-indigo-500 ring-2 ring-indigo-500/30 scale-105 bg-slate-800 text-white'

                      >

                )}

              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- Dynamic Slide Renderer Covering All Phases ---
    function SlideRenderer({ slide, theme, totalSlides, currentIndex }) {
      if (!slide) return null;

      // Header component inside slide
      const SlideHeader = ({ title, badge }) => (
        <div className="mb-6 flex items-start justify-between">
          <div>
            {badge && (
              <span className={`inline-block text-xs font-bold px-3 py-1 rounded-full border mb-2 ${theme.badge}`}>

          <div className="text-xs font-mono opacity-40">
            {currentIndex + 1} / {totalSlides}

        </div>
      );

      // Render based on slide type
      switch (slide.type) {
        
        // 1. TITLE SLIDE
        case 'title':
          return (
            <div className={`w-full h-full p-8 md:p-14 flex flex-col justify-between ${theme.bg}`}>
              <div>
                {slide.badge && (
                  <span className={`inline-block text-xs font-bold px-3.5 py-1.5 rounded-full border mb-4 ${theme.badge}`}>

                <h1 className={`text-4xl md:text-5xl lg:text-6xl font-black leading-tight mb-4 ${theme.textColor}`}>
                  {slide.title}
                </h1>
                {slide.subtitle && (
                  <p className={`text-lg md:text-xl font-medium leading-relaxed max-w-2xl ${theme.mutedText}`}>
                    {slide.subtitle}
                  </p>

                <div className={`w-20 h-1.5 rounded-full mt-6 bg-gradient-to-r ${theme.accentGradient}`} />
              </div>

              <div className="flex items-center justify-between pt-6 border-t border-white/10 text-xs">
                <span className={`font-semibold ${theme.textColor}`}>{slide.author || ''}</span>
                <span className={theme.mutedText}>{slide.date || ''}</span>
              </div>

        // 2. AGENDA / OVERVIEW
        case 'agenda':
          return (
            <div className={`w-full h-full p-8 md:p-12 flex flex-col justify-between ${theme.bg}`}>

                {slide.items && slide.items.map((item, idx) => (
                  <div key={idx} className={`p-4 rounded-xl flex items-start gap-4 ${theme.cardBg}`}>
                    <span className={`text-2xl font-black font-mono shrink-0 ${theme.accentColor}`}>
                      {item.number || `0${idx + 1}`}

                      <h3 className={`text-base font-bold ${theme.textColor}`}>{item.label}</h3>

                    </div>

        // 3. CARDS / FEATURES GRID

            <div className={`w-full h-full p-8 md:p-12 flex flex-col justify-between ${theme.bg}`}>
              <SlideHeader title={slide.title} badge={slide.badge} />

              <div className="flex-1 flex items-center">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5 w-full">
                  {slide.cards && slide.cards.map((c, idx) => (
                    <div key={idx} className={`p-6 rounded-2xl flex flex-col justify-between transition hover:-translate-y-1 duration-200 ${theme.cardBg}`}>
                      <div>
                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center mb-4 ${theme.badge}`}>

        // 4. BIG METRICS / STATS

              <div className="text-[11px] opacity-40 font-mono text-left">SlideCraft Presentation Engine</div>

        // 5. TIMELINE / ROADMAP
        case 'timeline':

            <div className={`w-full h-full p-8 md:p-12 flex flex-col justify-between ${theme.bg}`}>

              <div className="text-[11px] opacity-40 font-mono text-left">SlideCraft Presentation Engine</div>

        // 7. COMPARISON (Before vs After)
        case 'comparison':

            <div className={`w-full h-full p-8 md:p-12 flex flex-col justify-between ${theme.bg}`}>

              </div>

              <div className="max-w-2xl my-auto">
                <h2 className={`text-3xl md:text-5xl font-black mb-4 ${theme.textColor}`}>
                  {slide.title}
                </h2>
                <p className={`text-base md:text-lg mb-8 ${theme.mutedText}`}>
                  {slide.subtitle}
                </p>

                {slide.contact && (
                  <div className="inline-flex flex-wrap items-center justify-center gap-6 p-4 rounded-2xl bg-white/5 border border-white/10 text-xs">
                    {slide.contact.email && <span>📧 {slide.contact.email}</span>}
                    {slide.contact.website && <span>🌐 {slide.contact.website}</span>}
                    {slide.contact.phone && <span>📱 {slide.contact.phone}</span>}
                  </div>
                )}
              </div>

              <div className="text-[11px] opacity-40 font-mono">SlideCraft • نهاية العرض</div>
            </div>
          );

        default:
          return (
            <div className={`w-full h-full p-8 flex items-center justify-center ${theme.bg}`}>
              <div className="text-center">
                <h3 className="text-xl font-bold mb-2">نوع الشريحة غير معروف</h3>
                <p className="text-xs text-slate-400 font-mono">{JSON.stringify(slide)}</p>
              </div>
            </div>
          );
      }
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
